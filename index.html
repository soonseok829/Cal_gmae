<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>칼로리 키우기 3D - 순순순석 & 어푸어푸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    .font-game {
      font-family: 'Jua', sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ui-layer {
      position: relative;
      z-index: 10;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.9); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.15); opacity: 0; }
    }
    .float-text {
      position: fixed;
      font-family: 'Jua', sans-serif;
      font-size: 1.6rem;
      font-weight: bold;
      pointer-events: none;
      z-index: 50;
      animation: floatUp 1.1s ease-out forwards;
      text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    @keyframes popIn {
      0% { transform: translate(-50%, 10px) scale(0.8); opacity: 0; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }
    .speech-bubble {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

  <!-- 3D 캔버스 -->
  <div id="canvas-container"></div>

  <!-- 1. 캐릭터 선택 로비 화면 -->
  <div id="lobbyScreen" class="fixed inset-0 z-40 bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 flex flex-col items-center justify-center p-4 text-white interactive">
    <div class="text-center mb-6">
      <span class="inline-block px-3 py-1 bg-amber-400/20 text-amber-300 rounded-full text-xs font-bold tracking-wider mb-2 border border-amber-400/30">
        3D CALORIE GROWTH SIMULATION
      </span>
      <h1 class="font-game text-4xl sm:text-5xl text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-pink-200 to-cyan-200 drop-shadow">
        칼로리 키우기 3D
      </h1>
      <p class="text-slate-300 text-sm mt-2">키울 캐릭터를 선택하세요! 체중에 따라 얼굴과 체형이 실시간으로 변합니다.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 max-w-2xl w-full">
      <!-- 순순순석 카드 -->
      <div onclick="selectCharacter('sunseok')" class="group bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 hover:border-cyan-400 rounded-3xl p-5 cursor-pointer transition-all duration-300 transform hover:-translate-y-1 shadow-xl">
        <div class="flex items-center gap-4">
          <div class="w-20 h-20 rounded-2xl bg-cyan-500/20 border-2 border-cyan-300 overflow-hidden flex-shrink-0 flex items-center justify-center relative">
            <img id="lobby-img-sunseok" src="sunseok_normal.jpg" onerror="handleLobbyImgError(this, 'sunseok')" class="w-full h-full object-cover" alt="순순순석" />
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="font-game text-2xl text-white group-hover:text-cyan-300 transition">순순순석</h2>
              <span class="text-xs px-2 py-0.5 bg-cyan-500/30 text-cyan-200 rounded-full font-bold">기초대사량 괴물</span>
            </div>
            <p class="text-xs text-slate-300 mt-1 leading-relaxed">
              뭘 먹어도 살이 잘 안 찌는 축복받은 체질! 하지만 <span class="text-amber-300 font-bold">황금 조합</span>을 먹으면 3턴 동안 칼로리를 <span class="text-amber-300 font-bold">1.5배</span> 흡수합니다.
            </p>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-white/10 flex justify-between text-xs text-slate-300">
          <span>기본 흡수율: <strong class="text-cyan-300">0.55x</strong></span>
          <span>황금버프: <strong class="text-amber-300">1.5x (3턴)</strong></span>
          <span class="text-cyan-300 font-bold group-hover:translate-x-1 transition">플레이 →</span>
        </div>
      </div>

      <!-- 어푸어푸 카드 -->
      <div onclick="selectCharacter('eopu')" class="group bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 hover:border-pink-400 rounded-3xl p-5 cursor-pointer transition-all duration-300 transform hover:-translate-y-1 shadow-xl">
        <div class="flex items-center gap-4">
